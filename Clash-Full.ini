    # Steam 测试域名
    - "+.test.steampowered.com"
    # 游戏平台
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    # STUN 服务
    - "stun.*.*"
